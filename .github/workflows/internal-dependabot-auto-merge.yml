name: "Internal: Dependabot auto-merge"

# Self-caller: evaluates this repo's own Dependabot PRs for auto-merge
# (classify -> supply-chain + breaking-change + Bedrock changelog checks ->
# approve+merge or label for review). Fixes the gap where PR #192 got no
# evaluation. pull_request_target is required so the reusable has write
# access + org secrets on Dependabot PRs (it only reads PR metadata, never
# executes PR-branch code). Terraform bumps are always labeled blocked/*.
# Reusable definition: ./.github/workflows/automation-dependabot-auto-merge.yml

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  # check_suite drives event-driven re-merge: when a PR's checks finish, the
  # reusable workflow's remerge job merges an already-approved PR that was still
  # building at decide-time (instead of it waiting for the reconcile sweep).
  check_suite:
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot updates
    # pull_request_target: only Dependabot PRs enter the pipeline. check_suite:
    # only suites on Dependabot branches; the reusable workflow's remerge job
    # resolves + filters the associated PR (open, dependabot-authored,
    # merge/approved) itself.
    if: >-
      (github.event_name == 'check_suite' &&
       startsWith(github.event.check_suite.head_branch, 'dependabot/')) ||
      github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/automation-dependabot-auto-merge.yml
    with:
      # The workflow file and policy scripts resolve from the same trusted
      # default-branch commit on pull_request_target/check_suite events.
      actions_ref: ${{ github.workflow_sha }}
    secrets: inherit
