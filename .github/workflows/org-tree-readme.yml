name: Readme Tree (Reusable on PR)

# DEPRECATED / DISABLED (2026-08): the README `## Tree` section is being removed
# fleet-wide. The repo file tree is already visible in the GitHub file browser and
# every IDE, so a checked-in copy only added staleness-fighting CI and maintenance
# debt (issues #149, #208, #278) for a section nobody scrolled to.
#
# This reusable is intentionally kept as a no-op so existing callers stay GREEN
# while their `tree-readme.yml` caller and `.github/readmetreerc.yml` config are
# removed in a follow-up sweep. Once every caller is gone, this file is deleted.
# The workflow_call interface (inputs/secrets) is preserved so no caller breaks.

on:
  workflow_call:
    inputs:
      slack_channel_id:
        description: 'Deprecated (ignored). Kept for caller compatibility.'
        required: false
        type: string
        default: ''
      commit_message:
        type: string
        default: "chore: update README tree structure"
      exclude_pattern:
        type: string
        default: ".git|node_modules|.github"
      working_directory:
        type: string
        default: "."
    secrets:
      SLACK_BOT_TOKEN:
        description: 'Deprecated (ignored). Kept for caller compatibility.'
        required: false

permissions:
  contents: read

jobs:
  update-readme-on-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated no-op
        run: |
          echo "::notice::README Tree is deprecated and disabled. This workflow is a no-op."
          echo "Remove .github/workflows/tree-readme.yml and .github/readmetreerc.yml from this repo."
          {
            echo "### README Tree is disabled"
            echo ""
            echo "This reusable workflow no longer updates the README tree. It is a no-op kept"
            echo "only so callers stay green until their caller/config files are removed."
          } >> "$GITHUB_STEP_SUMMARY"
